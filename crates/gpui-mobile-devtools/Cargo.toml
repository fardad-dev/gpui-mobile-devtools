[package]
name = "gpui-mobile-devtools"
description = "Console and Network devtools for GPUI apps on Android and iOS: stream logs and HTTP traffic to a browser viewer over adb or Wi-Fi"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["gpui-pre"]
## Wrap the `HttpClient` of `gpui-pre` (Zed's weekly GPUI snapshots, used by
## gpui-kit and gpui-mobile).
gpui-pre = ["dep:gpui-pre-http", "dep:futures-io", "dep:anyhow"]
## Wrap the `HttpClient` of the `gpui` 0.2 crate published by Zed.
gpui = ["dep:gpui-http", "dep:futures-io", "dep:anyhow"]

[dependencies]
log = { version = "0.4.21", features = ["std"] }
serde_json = "1"
tungstenite = "0.30"
anyhow = { version = "1", optional = true }
futures-io = { version = "0.3", optional = true }
gpui-pre-http = { package = "gpui-pre-http-client", version = "0.3", optional = true }
gpui-http = { package = "gpui_http_client", version = "0.2", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

[package.metadata.docs.rs]
all-features = true
