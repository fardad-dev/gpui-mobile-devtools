[package]
name = "gpui-mobile-devtools-cli"
description = "Opens the gpui-mobile-devtools viewer for a GPUI app on a phone, over adb or Wi-Fi"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories = ["development-tools::debugging", "command-line-utilities"]

[[bin]]
name = "gpui-mobile-devtools"
path = "src/main.rs"

[dependencies]
gpui-mobile-devtools = { path = "../gpui-mobile-devtools", version = "0.1.0", default-features = false }
serde_json = "1"
